<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Jukebox</title>
<meta name="description" content="A personal collection of songs, streaming straight from the shelf.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="room">

  <header class="masthead">
    <h1 class="masthead__title" id="siteTitle">My Jukebox</h1>
    <p class="masthead__subtitle" id="siteSubtitle">A shelf of songs worth keeping.</p>
  </header>

  <main class="deck">

    <section class="platter" aria-label="Now playing">
      <div class="platter__record" id="record">
        <img id="cover" class="platter__cover" src="" alt="" hidden>
        <div class="platter__spindle"></div>
      </div>
      <div class="nowplaying">
        <p class="nowplaying__title" id="npTitle">Nothing queued yet</p>
        <p class="nowplaying__artist" id="npArtist">Pick a track from the shelf</p>

        <div class="scrubber">
          <span class="scrubber__time" id="curTime">0:00</span>
          <input type="range" id="seek" class="scrubber__bar" value="0" min="0" max="100" step="0.1">
          <span class="scrubber__time" id="durTime">0:00</span>
        </div>

        <div class="controls">
          <button class="controls__btn controls__btn--ghost" id="prevBtn" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
          </button>
          <button class="controls__btn controls__btn--main" id="playBtn" aria-label="Play" title="Play">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="controls__btn controls__btn--ghost" id="nextBtn" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l11-6z"/></svg>
          </button>

          <div class="volume">
            <svg viewBox="0 0 24 24" class="volume__icon"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
            <input type="range" id="volume" class="volume__bar" min="0" max="1" step="0.01" value="0.8">
          </div>
        </div>
      </div>
    </section>

    <section class="shelf" aria-label="Song list">
      <div class="shelf__head">
        <h2>Shelf</h2>
        <span class="shelf__count" id="trackCount"></span>
      </div>
      <ol class="shelf__list" id="trackList"></ol>
    </section>

  </main>

  <footer class="footnote">
    <p>Add or remove tracks by editing <code>songs.js</code>.</p>
  </footer>

</div>

<audio id="audio" preload="metadata"></audio>

<script src="songs.js"></script>
<script src="player.js"></script>
</body>
</html>
